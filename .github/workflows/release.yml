name: Release

# Builds and publishes nightly and stable releases on the GitHub mirror. Tags
# are created on Forgejo (.forgejo/workflows/cut-release.yml) and arrive here
# through the push mirror; vX.Y.Z-dev.N tags mark green commits on main and
# publish nothing. See docs/other/releases.md.
#
# GitHub sends no push event when more than three tags arrive at once, which
# can happen when the mirror catches up after an interval. Run this workflow
# by hand with the tag name to publish a release that was missed.
on:
  push:
    tags:
      - "v*"
      - "!v*-dev.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing nightly or stable tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-frontend:
    name: Build Frontend
    if: github.repository == 'ocman/ocman'
    runs-on: ubuntu-latest
    steps:
      - name: Check tag
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$ ]]; then
            echo "::error::${TAG} is not a nightly or stable release tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm
        run: npm install -g "pnpm@${{ steps.versions.outputs.pnpm }}"
      - run: make build-frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/static/

  build-desktop-macos:
    name: Build Desktop (macOS arm64)
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm
        run: npm install -g "pnpm@${{ steps.versions.outputs.pnpm }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Homebrew dependencies
        run: brew install librsvg create-dmg
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build macOS DMG installer
        run: make installer-mac VERSION="${TAG}"
      - name: Rename DMG for release
        run: mv dist/ocman.dmg dist/ocman-darwin-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ocman-darwin-arm64.dmg
          path: dist/ocman-darwin-arm64.dmg

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-desktop-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to ocman/homebrew-tap'
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/static/
      - uses: actions/download-artifact@v4
        with:
          name: ocman-darwin-arm64.dmg
          path: .release/
      - name: Recover changelog from annotated tag
        run: |
          set -euo pipefail
          # Checkout can leave a lightweight copy of the tag; refetch the
          # annotated tag whose message carries the changelog.
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "${TAG}" \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > .release/changelog.md
          if [ ! -s .release/changelog.md ]; then
            printf 'Release %s\n' "${TAG}" > .release/changelog.md
          fi
          cat .release/changelog.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v${{ steps.versions.outputs.goreleaser }}
          install-only: true
      - name: Test release configuration without publishing
        run: |
          goreleaser check
          python3 scripts/test_goreleaser.py
      - name: Build CLI, publish release and update Homebrew tap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
        run: goreleaser release --clean --release-notes=.release/changelog.md
