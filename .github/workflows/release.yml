name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build-frontend
      - uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: internal/server/static/

  build-frontend-wails:
    name: Build Frontend (Wails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (Wails output dir)
        working-directory: frontend
        run: WAILS_BUILD=1 npm run build
      - uses: actions/upload-artifact@v3
        with:
          name: frontend-dist-wails
          path: frontend/dist/

  build-desktop-mac:
    name: Build Desktop (macOS)
    needs: build-frontend-wails
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download Wails frontend
        uses: actions/download-artifact@v3
        with:
          name: frontend-dist-wails
          path: frontend/dist/
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Install librsvg (rsvg-convert)
        run: brew install librsvg
      - name: Generate app icon
        run: |
          mkdir -p build
          rsvg-convert -w 1024 -h 1024 frontend/public/favicon.svg -o build/appicon.png
      - name: Build desktop app
        run: wails build -skipbindings -s -nocolour
      - name: Build DMG installer
        run: |
          mkdir -p dist
          create-dmg \
            --volname "ocman" \
            --volicon "build/appicon.png" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "ocman.app" 140 190 \
            --hide-extension "ocman.app" \
            --app-drop-link 400 190 \
            --no-internet-enable \
            "dist/ocman-darwin.dmg" \
            "build/bin/"
      - uses: actions/upload-artifact@v3
        with:
          name: ocman-darwin.dmg
          path: dist/ocman-darwin.dmg

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v3
        with:
          name: frontend-dist
          path: internal/server/static/
      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ocman-${{ matrix.goos }}-${{ matrix.goarch }} -ldflags="-s -w" .
      - name: Package binary
        run: tar -czf ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ocman-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v3
        with:
          name: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          path: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, build-desktop-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover changelog from annotated tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          # `git tag -l --format='%(contents)'` returns the tag's
          # message body. Strip any PGP signature footer for safety.
          git tag -l --format='%(contents)' "${TAG_NAME}" \
            | python3 -c 'import sys; data = sys.stdin.read(); idx = data.find("-----BEGIN PGP SIGNATURE-----"); sys.stdout.write(data[:idx] if idx >= 0 else data)' \
            > changelog.md
          if [ ! -s changelog.md ]; then
            # Lightweight tag or empty annotation: fall back to the
            # historical placeholder so the release still publishes.
            printf 'Release %s\n' "${TAG_NAME}" > changelog.md
          fi
          printf -- '--- changelog.md ---\n'
          cat changelog.md
      - uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create Release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%/*}"
          repo="${REPOSITORY#*/}"
          api_base="${FORGEJO_API_URL}/repos/${owner}/${repo}"

          # Build the JSON payload via python3 so the changelog body
          # (multi-line Markdown) is properly escaped.
          payload="$(TAG_NAME="${TAG_NAME}" python3 -c 'import json, os; tag = os.environ["TAG_NAME"]; body = open("changelog.md", "r", encoding="utf-8").read().rstrip() + "\n"; print(json.dumps({"tag_name": tag, "target_commitish": tag, "name": tag, "body": body}))')"

          create_response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "${payload}" \
            "${api_base}/releases")"

          create_status="${create_response##*$'\n'}"
          create_body="${create_response%$'\n'*}"

          if [ "${create_status}" = "201" ]; then
            release_json="${create_body}"
          elif [ "${create_status}" = "409" ]; then
            releases_json="$(curl --silent --show-error \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              "${api_base}/releases?limit=100")"
            release_json="$(printf '%s' "${releases_json}" | python3 -c 'import json, os, sys; tag = os.environ["TAG_NAME"]; release = next((item for item in json.load(sys.stdin) if item.get("tag_name") == tag), None); sys.exit("existing release not found for tag " + tag) if release is None else print(json.dumps(release))')"
            existing_release_id="$(printf '%s' "${release_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
            # Re-runs: refresh the body so it matches the (possibly
            # updated) annotated tag instead of any stale placeholder.
            curl --silent --show-error --fail-with-body \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header "Content-Type: application/json" \
              --request PATCH \
              --data "${payload}" \
              "${api_base}/releases/${existing_release_id}" > /dev/null
          else
            printf '%s\n' "${create_body}"
            exit 1
          fi

          release_id="$(printf '%s' "${release_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          release_url="$(printf '%s' "${release_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["html_url"])')"

          shopt -s nullglob
          assets=(artifacts/*/ocman-*.tar.gz artifacts/*/ocman-*.dmg)
          if [ "${#assets[@]}" -eq 0 ]; then
            printf '%s\n' "No release assets found"
            exit 1
          fi

          existing_assets="$(curl --silent --show-error \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            "${api_base}/releases/${release_id}/assets")"

          for asset_path in "${assets[@]}"; do
            asset_name="$(basename "${asset_path}")"
            existing_asset_id="$(printf '%s' "${existing_assets}" | ASSET_NAME="${asset_name}" python3 -c 'import json, os, sys; name = os.environ["ASSET_NAME"]; assets = json.load(sys.stdin); match = next((item for item in assets if item.get("name") == name), None); print(match["id"] if match else "")')"

            if [ -n "${existing_asset_id}" ]; then
              curl --silent --show-error --fail-with-body \
                --header "Authorization: token ${FORGEJO_TOKEN}" \
                --request DELETE \
                "${api_base}/releases/${release_id}/assets/${existing_asset_id}"
            fi

            encoded_name="$(ASSET_NAME="${asset_name}" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["ASSET_NAME"]))')"

            curl --silent --show-error --fail-with-body \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --request POST \
              --data-binary @"${asset_path}" \
              "${api_base}/releases/${release_id}/assets?name=${encoded_name}"
          done

          printf 'Release published: %s\n' "${release_url}"
