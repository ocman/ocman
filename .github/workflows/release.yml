name: Release

# Builds and publishes nightly and stable releases on the GitHub mirror. Tags
# are created on Forgejo (.forgejo/workflows/cut-release.yml) and arrive here
# through the push mirror; vX.Y.Z-dev.N tags mark green commits on main and
# publish nothing. See docs/other/releases.md.
#
# GitHub sends no push event when more than three tags arrive at once, which
# can happen when the mirror catches up after an interval. Run this workflow
# by hand with the tag name to publish a release that was missed.
on:
  push:
    tags:
      - "v*"
      - "!v*-dev.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing nightly or stable tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-frontend:
    name: Build Frontend
    if: github.repository == 'ocman/ocman'
    runs-on: ubuntu-latest
    steps:
      - name: Check tag
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$ ]]; then
            echo "::error::${TAG} is not a nightly or stable release tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm
        run: npm install -g "pnpm@${{ steps.versions.outputs.pnpm }}"
      - run: make build-frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/static/

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/static/
      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ocman-${{ matrix.goos }}-${{ matrix.goarch }} -ldflags="-s -w -X main.version=${TAG}" .
      - name: Package binary
        run: tar -czf ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ocman-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          path: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  build-desktop-macos:
    name: Build Desktop (macOS arm64)
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm
        run: npm install -g "pnpm@${{ steps.versions.outputs.pnpm }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Homebrew dependencies
        run: brew install librsvg create-dmg
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build macOS DMG installer
        run: make installer-mac VERSION="${TAG}"
      - name: Rename DMG for release
        run: mv dist/ocman.dmg dist/ocman-darwin-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ocman-darwin-arm64.dmg
          path: dist/ocman-darwin-arm64.dmg

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, build-desktop-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Recover changelog from annotated tag
        run: |
          set -euo pipefail
          # Checkout can leave a lightweight copy of the tag; refetch the
          # annotated tag whose message carries the changelog.
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "${TAG}" \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > changelog.md
          if [ ! -s changelog.md ]; then
            printf 'Release %s\n' "${TAG}" > changelog.md
          fi
          printf -- '--- changelog.md ---\n'
          cat changelog.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*/ocman-*.tar.gz artifacts/*/ocman-*.dmg)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          mkdir -p dist/release
          cp "${assets[@]}" dist/release/
          ls -l dist/release
      # A re-run replaces the release so its notes and assets match this run.
      # Nightlies are prereleases and never become the "latest" release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release delete "${TAG}" --yes
          fi
          channel=(--latest)
          if [[ "${TAG}" == *-nightly.* ]]; then
            channel=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" dist/release/* \
            --verify-tag --title "${TAG}" --notes-file changelog.md "${channel[@]}"
