name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and publish site
    runs-on: [ubuntu-latest, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read pinned tool versions
        id: versions
        run: ./scripts/ci-tool-versions.sh
      # ponytail: tarball into ~/.local/bin, no sudo/dpkg needed on the runner.
      # Pinned by digest; update the version and both digests together with
      # mise.toml's hugo pin.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.164.0
          HUGO_SHA256_AMD64: fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4
          HUGO_SHA256_ARM64: 232d3bc2d1d9510625985ff7c89767598ffea5bc6e5e2882c791313f5a43f723
          MISE_HUGO_VERSION: ${{ steps.versions.outputs.hugo }}
        run: |
          set -euo pipefail
          if [ "${HUGO_VERSION}" != "${MISE_HUGO_VERSION}" ]; then
            echo "pages.yml installs Hugo ${HUGO_VERSION} but mise.toml pins ${MISE_HUGO_VERSION}" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64)        arch=amd64; sha="${HUGO_SHA256_AMD64}" ;;
            aarch64|arm64) arch=arm64; sha="${HUGO_SHA256_ARM64}" ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="hugo_extended_${HUGO_VERSION}_linux-${arch}.tar.gz"
          curl -sSfL --output "${tarball}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          printf '%s  %s\n' "${sha}" "${tarball}" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xz -C "$HOME/.local/bin" -f "${tarball}" hugo
          rm -f "${tarball}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make docs-build
      # ponytail: force-push a single commit; the pages branch is a build
      # artifact, not history. Keep history if you ever need rollbacks.
      - name: Publish to pages branch
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/public
          echo "ocman.stenic.io" > .domains
          git init -q -b pages
          git config user.name "ocman-ci"
          git config user.email "ci@ocman.stenic.io"
          git add -A
          git commit -qm "Deploy ${{ github.sha }}"
          git push -qf "https://x-access-token:$TOKEN@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" pages
