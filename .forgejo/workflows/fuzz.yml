name: Fuzz

# Runs every Go fuzz target for longer than a developer would locally. On
# failure, the crashing inputs Go wrote under testdata/fuzz are uploaded.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzzing time per target (go test -fuzztime)
        default: 60s

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: [ubuntu-latest, amd64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Setup and caching mirror the CI backend job. The fuzz targets need
      # no frontend build: internal/webui/static keeps a committed
      # robots.txt, so the embed compiles without assets.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install zstd
        run: apt-get update && apt-get install -y zstd
      # Restores the CI build cache; Go's fuzz cache (the corpus each run
      # grows) lives under ~/.cache/go-build/fuzz and is saved with it.
      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-fuzz-${{ runner.os }}-${{ runner.arch }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Fuzz script self-test
        run: ./scripts/fuzz_test.sh
      # The manual fuzztime input reaches the script only as an environment
      # variable, never as shell source; go test rejects invalid durations.
      - name: Fuzz
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '60s' }}
        run: ./scripts/fuzz.sh
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-failures
          path: |
            internal/**/testdata/fuzz/
            sdk/**/testdata/fuzz/
          retention-days: 30
