name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      # Forgejo Actions can't fetch pnpm/action-setup from GitHub, and
      # Node 25 no longer ships Corepack. Install pnpm directly to
      # match the version pinned via packageManager / mise.toml.
      - name: Install pnpm
        run: npm install -g pnpm@10.11.1
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b
      # The guard scripts all scan with ripgrep, which the runner image
      # does not ship. They were passing vacuously on exit 127.
      - name: Install ripgrep
        run: apt-get update && apt-get install -y ripgrep
      - name: Platform-branching guard
        run: ./scripts/check-platform-branching.sh
      - name: Settings-row guard
        run: ./scripts/check-settings-rows.sh
      - name: Host-helper guard
        run: |
          ./scripts/check_host_helpers_test.sh
          ./scripts/check-host-helpers.sh
      - name: Test with coverage
        run: make coverage SUITE=frontend
      - name: Fetch coverage baseline
        run: ./scripts/coverage-fetch-baseline.sh baseline
      - name: Check coverage ratchet
        run: make coverage-check BASELINE_DIR=baseline SUITE=frontend
      - name: Save coverage result
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: |
            coverage/frontend.json
            coverage/ratchet-result.json
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Only the pnpm store was cached. internal/server alone is ~100s
      # cold, and the suite now runs twice (once for coverage, once
      # under -race), so a cold build cache costs several minutes.
      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Install tmux
        run: apt-get update && apt-get install -y tmux
      - name: go.mod tidy check
        run: go mod tidy -diff
      # Nothing detected drift between remote.proto and its committed
      # stubs. protoc is pinned by digest because the generator stamps
      # its own version into the output, so an unpinned toolchain would
      # diff on the comment header alone.
      - name: Install protoc
        env:
          PROTOC_VERSION: 33.4
          PROTOC_SHA256_X86_64: c0040ea9aef08fdeb2c74ca609b18d5fdbfc44ea0042fcfbfb38860d35f7dd66
          PROTOC_SHA256_AARCH64: 15aa988f4a6090636525ec236a8e4b3aab41eef402751bd5bb2df6afd9b7b5a5
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x86_64;   sha="${PROTOC_SHA256_X86_64}" ;;
            aarch64) arch=aarch_64; sha="${PROTOC_SHA256_AARCH64}" ;;
            *)       echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          zip="protoc-${PROTOC_VERSION}-linux-${arch}.zip"
          curl -sSfL --output "${zip}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${zip}"
          printf '%s  %s\n' "${sha}" "${zip}" | sha256sum --check --strict
          unzip -q -o "${zip}" -d /usr/local
          rm -f "${zip}"
          protoc --version
      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generated gRPC stubs are current
        run: |
          make proto
          git diff --exit-code -- internal/remote/proto
      - name: Desktop build tags compile
        run: go build -tags desktop,exclude_graphdriver_devicemapper ./...
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: Test root package
        run: go test .
      - name: Test internal packages with coverage
        run: make coverage SUITE=go
      # ThreadSanitizer aborts on this runner ("unsupported VMA range:
      # Found 47 - Supported 48"): its arm64 shadow mapping needs a
      # 48-bit VA kernel and the host has 47. Nothing a container can
      # change, so skip rather than fail — `make test-race` stays the
      # local pre-PR check and starts guarding CI the day the runner is
      # x86_64 or 48-bit.
      - name: Race detector
        run: |
          if [ "$(uname -m)" != x86_64 ]; then
            echo "skipping: ThreadSanitizer is unsupported on $(uname -m) runners"
            exit 0
          fi
          make test-race
      - name: Fetch coverage baseline
        run: ./scripts/coverage-fetch-baseline.sh baseline
      # Go coverage of background goroutines (SSE loops, watchers, queue
      # sweepers) depends on how much of them ran before the test binary
      # exited, so a loaded runner measures a point or two low — #485 hit
      # -1.7% with every per-package number within 0.1% of a passing run.
      # Re-measure once before failing: a real regression reproduces.
      - name: Check coverage ratchet
        run: |
          if make coverage-check BASELINE_DIR=baseline SUITE=go; then
            exit 0
          fi
          echo "::warning::Go coverage ratchet failed; re-measuring once"
          make coverage SUITE=go
          make coverage-check BASELINE_DIR=baseline SUITE=go
      - name: Save coverage result
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: |
            coverage/go.json
            coverage/ratchet-result.json
          retention-days: 1

  coverage-results:
    name: Coverage Results
    needs: [frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Download frontend result
        uses: actions/download-artifact@v3
        with:
          name: frontend-coverage
          path: coverage/frontend
      - name: Download backend result
        uses: actions/download-artifact@v3
        with:
          name: backend-coverage
          path: coverage/backend
      - name: Merge coverage results
        run: |
          mkdir -p coverage
          node - <<'NODE'
          const fs = require('fs')
          const files = ['coverage/frontend/ratchet-result.json', 'coverage/backend/ratchet-result.json']
          const results = files.filter(fs.existsSync).map(file => JSON.parse(fs.readFileSync(file)))
          if (results.length) fs.writeFileSync('coverage/ratchet-result.json', JSON.stringify({
            overall: results.every(result => result.overall === 'pass') ? 'pass' : 'fail',
            tolerance: results[0].tolerance,
            suites: results.flatMap(result => result.suites),
          }))
          NODE
      - name: Comment coverage delta on PR
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: ./scripts/coverage-pr-comment.sh
      - name: Publish baseline to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.frontend.result == 'success' && needs.backend.result == 'success'
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          cp coverage/frontend/frontend.json coverage/frontend.json
          cp coverage/backend/go.json coverage/go.json
          ./scripts/coverage-publish-baseline.sh

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install pnpm
        run: npm install -g pnpm@10.11.1
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Run Playwright tests
        working-directory: frontend
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install pnpm
        run: npm install -g pnpm@10.11.1
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: make build
      - uses: actions/upload-artifact@v3
        with:
          name: ocman-linux-amd64
          path: ocman
          retention-days: 7

  tag:
    name: Semantic Tag
    needs: [frontend, backend, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - name: Decide next tag
        id: decide
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          FORGEJO_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%/*}"
          repo="${REPOSITORY#*/}"
          api_base="${FORGEJO_API_URL}/repos/${owner}/${repo}"

          git fetch --force --tags origin

          latest_tag="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "${latest_tag}" ]; then
            commit_range="${latest_tag}..${TARGET_SHA}"
            current_version="${latest_tag#v}"
          else
            commit_range="${TARGET_SHA}"
            current_version="0.0.0"
          fi

          subjects="$(git log --format=%s "${commit_range}")"
          if [ -z "${subjects}" ]; then
            printf '%s\n' "No commits to evaluate for a new release"
            printf 'release=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          bodies="$(git log --format=%b "${commit_range}")"

          if printf '%s\n%s\n' "${subjects}" "${bodies}" | grep -Eq 'BREAKING CHANGE:|^[a-z]+(\([^)]+\))?!:'; then
            bump="major"
          elif printf '%s\n' "${subjects}" | grep -Eq '^feat(\([^)]+\))?:'; then
            bump="minor"
          elif printf '%s\n' "${subjects}" | grep -Eq '^(fix|perf|refactor)(\([^)]+\))?:'; then
            bump="patch"
          else
            printf '%s\n' "No releasable conventional commits found"
            printf 'release=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          IFS=. read -r major minor patch <<EOF
          ${current_version}
          EOF

          case "${bump}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          tag_lookup="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: token ${RELEASE_TOKEN}" \
            "${api_base}/tags/${next_tag}")"

          if [ "${tag_lookup}" = "200" ]; then
            printf 'Tag already exists: %s\n' "${next_tag}"
            printf 'release=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${tag_lookup}" != "404" ]; then
            printf 'Unexpected tag lookup response: %s\n' "${tag_lookup}"
            exit 1
          fi

          {
            printf 'release=true\n'
            printf 'next_tag=%s\n' "${next_tag}"
            printf 'previous_tag=%s\n' "${latest_tag}"
            printf 'target_sha=%s\n' "${TARGET_SHA}"
          } >> "${GITHUB_OUTPUT}"

          printf 'Will create tag %s from %s (previous=%s)\n' \
            "${next_tag}" "${TARGET_SHA}" "${latest_tag:-<none>}"
      - name: Compute changelog range
        id: range
        if: steps.decide.outputs.release == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.decide.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_TAG}" ]; then
            printf 'range=%s..HEAD\n' "${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"
          else
            # First release: let git-cliff walk the full history.
            printf 'range=\n' >> "${GITHUB_OUTPUT}"
          fi
      # Pinned by digest: this job holds secrets.RELEASE_PAT and
      # contents: write, so an unverified tarball piped straight into tar
      # would be a supply-chain foothold. Update both digests when
      # bumping the version.
      - name: Install git-cliff
        if: steps.decide.outputs.release == 'true'
        env:
          GIT_CLIFF_VERSION: 2.13.1
          GIT_CLIFF_SHA256_X86_64: 200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249
          GIT_CLIFF_SHA256_AARCH64: 4054c124b926c117f3fa048939bc8be0a954f29f3b6f367627e8cb22c1971882
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x86_64;  sha="${GIT_CLIFF_SHA256_X86_64}" ;;
            aarch64) arch=aarch64; sha="${GIT_CLIFF_SHA256_AARCH64}" ;;
            *)       echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          tarball="git-cliff-${GIT_CLIFF_VERSION}-${arch}-unknown-linux-musl.tar.gz"
          curl -sSfL --output "${tarball}" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${tarball}"
          printf '%s  %s\n' "${sha}" "${tarball}" | sha256sum --check --strict
          tar -xz --strip-components=1 -C /usr/local/bin \
            -f "${tarball}" "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          rm -f "${tarball}"
          git-cliff --version
      - name: Render changelog
        if: steps.decide.outputs.release == 'true'
        env:
          NEXT_TAG: ${{ steps.decide.outputs.next_tag }}
          RANGE: ${{ steps.range.outputs.range }}
        run: git-cliff --config cliff.toml --tag "${NEXT_TAG}" ${RANGE} --output changelog.md
      - name: Append compare link
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.previous_tag != ''
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.decide.outputs.previous_tag }}
          NEXT_TAG: ${{ steps.decide.outputs.next_tag }}
        run: |
          set -euo pipefail
          {
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "${SERVER_URL}" "${REPOSITORY}" "${PREVIOUS_TAG}" "${NEXT_TAG}"
          } >> changelog.md
          printf -- '--- changelog.md ---\n'
          cat changelog.md
      - name: Create and push annotated tag
        if: steps.decide.outputs.release == 'true'
        env:
          NEXT_TAG: ${{ steps.decide.outputs.next_tag }}
          TARGET_SHA: ${{ steps.decide.outputs.target_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Annotated tag carries the changelog as its message; the
          # release workflow recovers it via `git tag -l --format`.
          # `--cleanup=verbatim` preserves `### Heading` lines that
          # git would otherwise strip as comments.
          git tag -a -F changelog.md --cleanup=verbatim "${NEXT_TAG}" "${TARGET_SHA}"
          git push origin "${NEXT_TAG}"
          printf 'Created and pushed tag %s from %s\n' "${NEXT_TAG}" "${TARGET_SHA}"
