name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: [ubuntu-latest, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install pnpm
        run: npm install -g pnpm@10.11.1
      - run: make build-frontend
      - uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: internal/webui/static/

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-frontend
    runs-on: [ubuntu-latest, amd64]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v3
        with:
          name: frontend-dist
          path: internal/webui/static/
      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ocman-${{ matrix.goos }}-${{ matrix.goarch }} -ldflags="-s -w" .
      - name: Package binary
        run: tar -czf ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ocman-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v3
        with:
          name: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          path: ocman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  build-desktop-macos:
    name: Build Desktop (macOS arm64)
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install pnpm
        run: npm install -g pnpm@10.11.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Homebrew dependencies
        run: brew install librsvg create-dmg
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build macOS DMG installer
        run: make installer-mac
      - name: Rename DMG for release
        run: mv dist/ocman.dmg dist/ocman-darwin-arm64.dmg
      - uses: actions/upload-artifact@v3
        with:
          name: ocman-darwin-arm64.dmg
          path: dist/ocman-darwin-arm64.dmg

  release:
    name: Publish Release
    runs-on: [ubuntu-latest, amd64]
    needs: [build, build-desktop-macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover changelog from annotated tag
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          # `git tag -l --format='%(contents)'` returns the tag's
          # message body. Strip any PGP signature footer for safety.
          git tag -l --format='%(contents)' "${TAG_NAME}" \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > changelog.md
          if [ ! -s changelog.md ]; then
            # Lightweight tag or empty annotation: fall back to the
            # historical placeholder so the release still publishes.
            printf 'Release %s\n' "${TAG_NAME}" > changelog.md
          fi
          printf -- '--- changelog.md ---\n'
          cat changelog.md
          delimiter="changelog-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'notes<<%s\n' "${delimiter}"
            cat changelog.md
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*/ocman-*.tar.gz artifacts/*/ocman-*.dmg)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          mkdir -p dist/release
          cp "${assets[@]}" dist/release/
          ls -l dist/release
      # override: true deletes any release for this tag before creating it,
      # so a re-run refreshes the notes and replaces every asset. The action
      # uploads with a pinned tea and publishes as a non-draft release; tags
      # containing "-rc" are marked as pre-releases.
      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.9.1
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ github.token }}
          release-dir: dist/release
          release-notes: ${{ steps.changelog.outputs.notes }}
          override: true
