root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ocman ."
  bin = "./tmp/ocman"
  full_bin = "./tmp/ocman -addr 127.0.0.1:8229"
  include_ext = ["go"]
  exclude_dir = ["tmp", "frontend", "internal/webui/static"]
  delay = 1000
  # Send SIGINT (not SIGKILL) to the built binary and wait for a graceful
  # shutdown before forcing. Without this, the binary can outlive `air`
  # when `make` is Ctrl-C'd, re-parent to init, and hold :8229 — causing
  # the next `make dev-prod-watch` to fatal with "bind: address already
  # in use".
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
