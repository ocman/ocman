repos:
  - repo: local
    hooks:
      - id: test-backend
        name: go tests
        language: system
        entry: make test-backend
        pass_filenames: false
        files: '\.go$'
      - id: test-frontend
        name: pnpm tests
        language: system
        entry: make test-frontend
        pass_filenames: false
        files: '^frontend/'
