id: adversarial-migration-item
name: Adversarial migration item
version: "1"
concurrency: 4
directory: /workspace/repository
workspace:
  repo: /workspace/repository
  shards: 2
pools:
  - name: agents
    capacity: 4
  - name: commits
    capacity: 1
triggers:
  - id: manual
    type: manual
nodes:
  - id: implement
    name: Implement migration item
    type: agent
    resources:
      - pool: agents
        units: 1
    lease:
      mode: path
      paths: ["src"]
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Implement migration item ${item.id} at ${item.path}.
        Use only this item and the shared migration guidance supplied by the workflow author.
        Do not stage, reset, stash, commit, or push.
        Include the exact `git diff --no-ext-diff --no-textconv --` output.
      outputSchema:
        type: object
        properties:
          summary: {type: string}
          diff: {type: string}
        required: [summary, diff]
  - id: review-correctness
    name: Review correctness independently
    type: agent
    resources:
      - pool: agents
        units: 1
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Review implementation result ${nodes.implement.output} for ${item.id} against the correctness policy.
        Do not edit files or use implementer session context.
      outputSchema:
        type: object
        properties:
          approved: {type: boolean}
          findings: {type: array}
        required: [approved, findings]
  - id: review-adversarial
    name: Review adversarially and independently
    type: agent
    resources:
      - pool: agents
        units: 1
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Review implementation result ${nodes.implement.output} for ${item.id} against the adversarial policy.
        Do not edit files or use implementer session context.
      outputSchema:
        type: object
        properties:
          approved: {type: boolean}
          findings: {type: array}
        required: [approved, findings]
  - id: fix-findings
    name: Join review findings and fix
    type: agent
    resources:
      - pool: agents
        units: 1
    lease:
      mode: path
      paths: ["src"]
    repeat:
      until: outcomes["fix-findings"].output.fixed == true
      maxAttempts: 2
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Join correctness findings ${nodes.review-correctness.output} and adversarial findings ${nodes.review-adversarial.output}
        for ${item.id}, then fix verified issues. Do not stage, reset, stash, commit, or push.
      outputSchema:
        type: object
        properties:
          fixed: {type: boolean}
          summary: {type: string}
        required: [fixed, summary]
  - id: validate-item
    name: Validate migration item
    type: command
    command: ["/bin/sh", "-c", "bun test >/dev/null && printf '{\"valid\":true}'"]
    permission:
      - permission: bash
        pattern: "/bin/sh -c bun test *"
        action: allow
  - id: commit-item
    name: Serialized commit coordinator
    type: command
    resources:
      - pool: commits
        units: 1
    lease:
      mode: exclusive
      commit: true
    command: ["/bin/sh", "-c", "git commit -am 'migrate item' >/dev/null && printf '{\"committed\":true}'"]
    permission:
      - permission: bash
        pattern: "/bin/sh -c git commit *"
        action: allow
dependencies:
  - from: implement
    to: review-correctness
  - from: implement
    to: review-adversarial
  - from: review-correctness
    to: fix-findings
  - from: review-adversarial
    to: fix-findings
  - from: fix-findings
    to: validate-item
  - from: validate-item
    to: commit-item
