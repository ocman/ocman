id: adversarial-migration-item
name: Adversarial migration item
version: "1"
concurrency: 4
directory: /workspace/repository
workspace:
  repo: /workspace/repository
  shards: 2
pools:
  - name: agents
    capacity: 4
  - name: commits
    capacity: 1
triggers:
  - id: manual
    type: manual
nodes:
  - id: implement
    name: Implement migration item
    type: agent
    resources:
      - pool: agents
        units: 1
    lease:
      mode: path
      paths: ["src"]
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Implement migration item ${item.id} at ${item.path}.
        Use only this item and the shared migration guidance supplied by the workflow author.
        Produce a diff artifact; do not stage, reset, stash, commit, or push.
      collectors:
        - name: diff
          type: diff
  - id: review-correctness
    name: Review correctness independently
    type: agent
    resources:
      - pool: agents
        units: 1
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Review only the declared implementation diff for ${item.id} against the correctness policy.
        Return structured findings. Do not edit files or use implementer session context.
      collectors:
        - name: findings
          type: json-file
          path: review-correctness.json
  - id: review-adversarial
    name: Review adversarially and independently
    type: agent
    resources:
      - pool: agents
        units: 1
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Review only the declared implementation diff for ${item.id} against the adversarial policy.
        Return structured findings. Do not edit files or use implementer session context.
      collectors:
        - name: findings
          type: json-file
          path: review-adversarial.json
  - id: fix-findings
    name: Join review findings and fix
    type: agent
    resources:
      - pool: agents
        units: 1
    lease:
      mode: path
      paths: ["src"]
    repeat:
      until: artifacts["review-correctness.findings"].approved == true && artifacts["review-adversarial.findings"].approved == true
      maxAttempts: 2
    agent:
      platform: opencode
      directory: /workspace/repository
      prompt: |
        Join the two declared structured review findings for ${item.id}, fix verified issues,
        and produce an updated diff. Do not stage, reset, stash, commit, or push.
      collectors:
        - name: diff
          type: diff
  - id: validate-item
    name: Validate migration item
    type: command
    command: ["bun", "test"]
    permission:
      - permission: bash
        pattern: "bun test"
        action: allow
    outputs:
      - name: validation
        type: text
  - id: commit-item
    name: Serialized commit coordinator
    type: command
    resources:
      - pool: commits
        units: 1
    lease:
      mode: exclusive
      commit: true
    command: ["git", "commit", "-am", "migrate item"]
    permission:
      - permission: bash
        pattern: "git commit *"
        action: allow
dependencies:
  - from: implement
    to: review-correctness
  - from: implement
    to: review-adversarial
  - from: review-correctness
    to: fix-findings
  - from: review-adversarial
    to: fix-findings
  - from: fix-findings
    to: validate-item
  - from: validate-item
    to: commit-item
