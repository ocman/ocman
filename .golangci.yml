version: "2"

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # HTTP response bodies must be closed
    - copyloopvar    # loop-var copy bugs (Go 1.22+)
    - errorlint      # correct error wrapping / comparison
    - forbidigo      # host helpers must stay behind the hostsvc boundary
    - misspell       # typos in comments & strings
    - unconvert      # redundant type conversions
    - usestdlibvars  # use net/http constants etc.
    - wastedassign   # assignments never read
    - whitespace     # stray leading/trailing blank lines
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^git\.(GetDiff|Lookup|LookupMany|ListBranches|Checkout|ListWorktrees|CreateWorktree|RemoveWorktree|ResolveRepoRoot|ResolveBaseRef)$'
          pkg: '^github.com/NoUseFreak/ocman/internal/git$'
          msg: Route host operations through hostsvc.Host.
        - pattern: '^tmux\.(ListClients|ListSessions|ListWindows|SwitchClient|LaunchOpencode.*)$'
          pkg: '^github.com/NoUseFreak/ocman/internal/tmux$'
          msg: Route host operations through hostsvc.Host.
        - pattern: '^term\.(AttachLocalPTY|CreateWindow|Windows|KillWindow)$'
          pkg: '^github.com/NoUseFreak/ocman/internal/term$'
          msg: Route host operations through hostsvc.Host.
        - pattern: '^gitexec\.(Output|Command)$'
          pkg: '^github.com/NoUseFreak/ocman/internal/gitexec$'
          msg: Route host operations through hostsvc.Host.
  exclusions:
    rules:
      - linters: [forbidigo]
        path-except: '^internal/(server|mcp|tmuxmod|termmod|gitmod)/'
      - linters: [forbidigo]
        path: '(_test\.go$|^internal/server/(tmux|term|host|host_wiring)\.go$)'
      # Runner fields are injected owner-routed callbacks, not package calls.
      - linters: [forbidigo]
        path: '^internal/tmuxmod/module\.go$'
        source: 'Runner\.ListClients'
      # Best-effort resource cleanup — deliberately unchecked so we
      # don't litter `_ =` on every defer / t.Cleanup.
      - linters: [errcheck]
        source: '\.(Close|Shutdown|Unregister|RemoveAll)\('
      - linters: [errcheck]
        source: 'os\.(Remove|Unsetenv)\('
      # Writes to an http.ResponseWriter after the status is committed.
      - linters: [errcheck]
        source: '(w\.Write|fmt\.Fprint)'
      # Fire-and-forget background cache warm; retried on the next tick.
      - path: internal/platforms/opencode/models_cache\.go
        linters: [errcheck]
        source: refreshSessions
