syntax = "proto3";

package ocman.remote.v1;

option go_package = "github.com/NoUseFreak/ocman/internal/remote/proto;remotepb";

// Ocman is the hub<->remote gRPC contract for multi-remote support.
//
// Per architecture AD-11, rich nested types (db.Session, SessionDetail,
// LivePrompt, etc.) travel as JSON bytes because the two ends are the same
// codebase/version (guarded by the Hello protocol-version handshake, AD-12).
// Unary JSON operations share the generic Call RPC; typed RPCs remain only
// for the handshake, streams and requests with typed routing fields.
//
// Platform fields carry the BASE platform id (the hub strips the
// "r-<remoteID>:" prefix before calling). All RPCs require the bearer
// token (AD-4).
service Ocman {
  // Handshake: exchanged once after dialing (AD-12).
  rpc Hello(HelloReq) returns (HelloResp);

  // Call runs one named unary operation. An unknown method answers
  // Unimplemented, so callers keep their fallbacks for older owners.
  rpc Call(CallReq) returns (JsonResp);

  // --- Session reads with typed routing fields ---
  rpc Sessions(SessionsReq) returns (JsonResp);           // []db.Session
  rpc Session(SessionReq) returns (JsonResp);             // *SessionDetail
  rpc SessionsInactiveBefore(CutoffReq) returns (JsonResp);

  // --- Streaming events (tunneled to hub SSE) ---
  rpc StreamEvents(SessionRef) returns (stream EventChunk);

  // First payload is attachment metadata JSON; subsequent payloads are bytes.
  rpc SaveComposerAttachment(stream JsonReq) returns (JsonResp);

  // TerminalStream bridges a browser xterm.js WebSocket to a PTY
  // attached to the owner's tmux. Client->server frames carry keystrokes
  // and resize control; server->client frames carry PTY output.
  rpc TerminalStream(stream TermClientMsg) returns (stream TermServerMsg);
}

message HelloReq {
  int32 protocol_version = 1;
}

message HelloResp {
  int32 protocol_version = 1;
  string instance_id = 2;
  string hostname = 3;
  string ocman_version = 4;
  repeated string platforms = 5; // enabled local base platform ids; absent means opencode
}

// SessionRef carries the base platform id plus a session id.
message SessionRef {
  string platform = 1;
  string session_id = 2;
}

message SessionsReq {
  string platform = 1;
  string dir = 2;
  int64 since = 3;
  bytes sidebar_query = 4; // optional platforms.SidebarQuery JSON; old peers retain their existing list behavior
}

message SessionReq {
  string platform = 1;
  string session_id = 2;
  int32 limit = 3;
  int32 offset = 4;
  reserved 5;
  reserved "browsing";
}

message CutoffReq {
  string platform = 1;
  int64 cutoff = 2;
}

// JsonResp / JsonReq wrap an opaque JSON payload (AD-11).
message JsonResp {
  bytes payload = 1;
}

message JsonReq {
  bytes payload = 1;
}

// CallReq names a unary operation. Platform and session_id are set for
// platform- and session-scoped operations; payload is the JSON request body.
message CallReq {
  string method = 1;
  string platform = 2;
  string session_id = 3;
  bytes payload = 4;
}

message EventChunk {
  bytes data = 1;
}

// TermClientMsg is a hub->remote terminal frame. The first message on a
// TerminalStream MUST carry `open` to select the target window; later
// messages carry `data` (raw keystrokes) or `resize`.
message TermClientMsg {
  TermOpen open = 1;
  bytes data = 2;
  TermResize resize = 3;
}

message TermOpen {
  string dir = 1;
  string window = 2;
  bool readonly = 3;
}

message TermResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// TermServerMsg is a remote->hub terminal frame carrying PTY output.
message TermServerMsg {
  bytes data = 1;
}
